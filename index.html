<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>個人記帳助手 Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        body { 
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            -webkit-tap-highlight-color: transparent;
        }
        .glass {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        .tab-btn { transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
        input, select, textarea { font-size: 16px !important; } 
        
        /* 幣別按鈕點擊效果 */
        .currency-btn-active {
            background-color: #4f46e5 !important;
            color: white !important;
            border-color: #4f46e5 !important;
            box-shadow: 0 4px 6px -1px rgba(79, 70, 229, 0.4);
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-up { animation: slideUp 0.4s ease-out forwards; }

        .loading-spinner {
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top: 3px solid white;
            width: 20px;
            height: 20px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="p-4 flex items-start justify-center pt-8 md:items-center md:pt-4">
    <div class="w-full max-w-md animate-up">
        <header class="mb-6 text-center text-white">
            <h1 class="text-3xl font-extrabold tracking-tight">智能記帳</h1>
            <p class="opacity-80 mt-1 font-medium text-sm">即時匯率 · 自動同步至 Sheets</p>
        </header>

        <div class="glass p-6 md:p-8 rounded-[2.5rem] shadow-2xl">
            <!-- 收支切換 -->
            <div class="flex mb-6 bg-gray-100/80 p-1 rounded-2xl">
                <button id="tabExpense" onclick="setType('Expense')" class="tab-btn flex-1 py-3 rounded-xl font-bold text-center z-10 bg-white text-indigo-600 shadow-sm">
                    支出
                </button>
                <button id="tabIncome" onclick="setType('Income')" class="tab-btn flex-1 py-3 rounded-xl font-bold text-center z-10 text-gray-500">
                    收入
                </button>
            </div>

            <!-- 幣別選擇 -->
            <div class="mb-6">
                <label class="block text-xs font-bold text-gray-400 uppercase tracking-wider mb-2 ml-1">使用幣別 (Currency)</label>
                <div class="grid grid-cols-4 gap-2">
                    <button type="button" onclick="setCurrency('MOP')" class="currency-btn py-2.5 rounded-xl border-2 border-gray-100 bg-gray-50 text-gray-600 font-bold text-xs currency-btn-active" data-curr="MOP">MOP</button>
                    <button type="button" onclick="setCurrency('HKD')" class="currency-btn py-2.5 rounded-xl border-2 border-gray-100 bg-gray-50 text-gray-600 font-bold text-xs" data-curr="HKD">HKD</button>
                    <button type="button" onclick="setCurrency('CNY')" class="currency-btn py-2.5 rounded-xl border-2 border-gray-100 bg-gray-50 text-gray-600 font-bold text-xs" data-curr="CNY">RMB</button>
                    <button type="button" onclick="setCurrency('USD')" class="currency-btn py-2.5 rounded-xl border-2 border-gray-100 bg-gray-50 text-gray-600 font-bold text-xs" data-curr="USD">USD</button>
                    <button type="button" onclick="setCurrency('JPY')" class="currency-btn py-2.5 rounded-xl border-2 border-gray-100 bg-gray-50 text-gray-600 font-bold text-xs" data-curr="JPY">JPY</button>
                    <button type="button" onclick="setCurrency('TWD')" class="currency-btn py-2.5 rounded-xl border-2 border-gray-100 bg-gray-50 text-gray-600 font-bold text-xs" data-curr="TWD">TWD</button>
                    <button type="button" onclick="setCurrency('KRW')" class="currency-btn py-2.5 rounded-xl border-2 border-gray-100 bg-gray-50 text-gray-600 font-bold text-xs" data-curr="KRW">KRW</button>
                </div>
            </div>

            <form id="recordForm" class="space-y-5">
                <!-- 類別選擇 -->
                <div id="typeContainer" class="transition-all duration-300">
                    <label class="block text-xs font-bold text-gray-400 uppercase tracking-wider mb-2 ml-1">支出類別</label>
                    <div class="relative">
                        <select id="expenseType" class="w-full p-4 bg-gray-50 border-2 border-transparent focus:border-indigo-500 rounded-2xl outline-none appearance-none transition-all font-semibold text-gray-700">
                            <option value="餐飲">飲食 🍔</option>
                            <option value="交通">交通 🏎️</option>
                            <option value="購物">購物 🎁</option>
                            <option value="娛樂">娛樂 🎮</option>
                            <option value="醫療">醫療 💊</option>
                            <option value="居家">居家 🏡</option>
                            <option value="其他">其他 ✨</option>
                        </select>
                        <div class="absolute right-4 top-1/2 -translate-y-1/2 pointer-events-none text-gray-400">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M5.293 7.293a1 1 0 011.414 0L10 10.586l3.293-3.293a1 1 0 111.414 1.414l-4 4a1 1 0 01-1.414 0l-4-4a1 1 0 010-1.414z" clip-rule="evenodd" /></svg>
                        </div>
                    </div>
                </div>

                <!-- 金額輸入 (已加入 step="any" 允許小數) -->
                <div class="input-group">
                    <label class="block text-xs font-bold text-gray-400 uppercase tracking-wider mb-2 ml-1">金額 (<span id="currencyLabel">MOP</span>)</label>
                    <div class="relative">
                        <div class="absolute left-4 top-1/2 -translate-y-1/2 bg-indigo-100 text-indigo-600 px-2 py-1 flex items-center justify-center rounded-lg font-bold text-[10px]" id="currencySymbol">MOP</div>
                        <input type="number" id="amount" step="any" inputmode="decimal" required placeholder="0.00" oninput="updateConvertedAmount()"
                               class="w-full p-4 pl-16 bg-gray-50 border-2 border-transparent focus:border-indigo-500 rounded-2xl outline-none transition-all font-extrabold text-xl text-gray-800">
                    </div>
                    <p id="conversionHint" class="mt-2 text-xs text-indigo-500 font-bold ml-1 hidden"></p>
                </div>

                <!-- 備註輸入 -->
                <div>
                    <label class="block text-xs font-bold text-gray-400 uppercase tracking-wider mb-2 ml-1">備註 (Remarks)</label>
                    <textarea id="remarks" rows="2" placeholder="紀錄細節..." 
                              class="w-full p-4 bg-gray-50 border-2 border-transparent focus:border-indigo-500 rounded-2xl outline-none transition-all font-medium text-gray-700"></textarea>
                </div>

                <!-- 提交按鈕 -->
                <button type="submit" id="submitBtn" class="w-full bg-indigo-600 hover:bg-indigo-700 active:scale-[0.98] text-white font-extrabold py-4 rounded-2xl shadow-xl shadow-indigo-100 transition-all flex items-center justify-center gap-3">
                    <span class="text-lg">確認儲存</span>
                </button>
            </form>
        </div>

        <div id="statusMsg" class="mt-6 p-4 rounded-2xl text-center hidden font-bold shadow-lg bg-white transition-all"></div>
    </div>

    <script>
        let currentType = 'Expense';
        let selectedCurrency = 'MOP';
        let exchangeRates = { "MOP": 1, "HKD": 1.0315, "CNY": 1.13, "KRW": 0.006, "JPY": 0.053, "TWD": 0.25, "USD": 8.03 };
        
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwQNQ2SQ06W2OwMxnZji3DyR1gWNHM3tf9ALkLhIHkDQK0XiJj84tMRzPfEQ5SxRZVW/exec";

        async function fetchRates() {
            try {
                const res = await fetch('https://open.er-api.com/v6/latest/USD');
                const data = await res.json();
                if (data && data.rates) {
                    const usdToMop = 8.05;
                    const rates = data.rates;
                    exchangeRates["USD"] = usdToMop;
                    exchangeRates["HKD"] = usdToMop / rates.HKD;
                    exchangeRates["CNY"] = usdToMop / rates.CNY;
                    exchangeRates["KRW"] = usdToMop / rates.KRW;
                    exchangeRates["JPY"] = usdToMop / rates.JPY;
                    exchangeRates["TWD"] = usdToMop / rates.TWD;
                }
            } catch (e) { console.warn("使用預設匯率"); }
        }
        fetchRates();

        function setCurrency(curr) {
            selectedCurrency = curr;
            document.getElementById('currencyLabel').innerText = (curr === 'CNY' ? 'RMB' : curr);
            document.getElementById('currencySymbol').innerText = (curr === 'CNY' ? 'RMB' : curr);
            
            document.querySelectorAll('.currency-btn').forEach(btn => {
                if (btn.getAttribute('data-curr') === curr) {
                    btn.classList.add('currency-btn-active');
                    btn.classList.remove('border-gray-100', 'bg-gray-50', 'text-gray-600');
                } else {
                    btn.classList.remove('currency-btn-active');
                    btn.classList.add('border-gray-100', 'bg-gray-50', 'text-gray-600');
                }
            });
            updateConvertedAmount();
        }

        function updateConvertedAmount() {
            const amount = document.getElementById('amount').value;
            const hint = document.getElementById('conversionHint');
            if (!amount || selectedCurrency === 'MOP') {
                hint.classList.add('hidden');
                return;
            }
            const converted = (amount * exchangeRates[selectedCurrency]).toFixed(2);
            hint.innerText = `≈ MOP ${converted} (匯率參考 XE)`;
            hint.classList.remove('hidden');
        }

        function setType(type) {
            currentType = type;
            const tabExpense = document.getElementById('tabExpense');
            const tabIncome = document.getElementById('tabIncome');
            const typeContainer = document.getElementById('typeContainer');

            if (type === 'Expense') {
                tabExpense.className = "tab-btn flex-1 py-3 rounded-xl font-bold text-center z-10 bg-white text-indigo-600 shadow-sm";
                tabIncome.className = "tab-btn flex-1 py-3 rounded-xl font-bold text-center z-10 text-gray-500";
                typeContainer.classList.remove('hidden');
            } else {
                tabIncome.className = "tab-btn flex-1 py-3 rounded-xl font-bold text-center z-10 bg-white text-indigo-600 shadow-sm";
                tabExpense.className = "tab-btn flex-1 py-3 rounded-xl font-bold text-center z-10 text-gray-500";
                typeContainer.classList.add('hidden');
            }
        }

        document.getElementById('recordForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('submitBtn');
            const amount = document.getElementById('amount').value;
            const remarksInput = document.getElementById('remarks').value;
            const category = currentType === 'Expense' ? document.getElementById('expenseType').value : 'Income';
            
            const convertedMOP = (amount * exchangeRates[selectedCurrency]).toFixed(2);
            const currDisplay = selectedCurrency === 'CNY' ? 'RMB' : selectedCurrency;
            const finalRemarks = selectedCurrency !== 'MOP' ? `[${currDisplay} ${amount}] ${remarksInput}` : remarksInput;

            btn.disabled = true;
            btn.innerHTML = '<div class="loading-spinner"></div> <span>同步中...</span>';

            const params = new URLSearchParams({
                entryType: currentType,
                category: category,
                amount: convertedMOP,
                remarks: finalRemarks,
                date: new Date().toLocaleDateString('zh-TW'),
                who: 'Self'
            });

            try {
                await fetch(SCRIPT_URL, { method: 'POST', mode: 'no-cors', body: params });
                showStatus("✨ 記錄成功！已同步至 Sheets", "success");
                document.getElementById('recordForm').reset();
                setCurrency('MOP');
            } catch (error) {
                showStatus("❌ 傳送失敗，請重試", "error");
            } finally {
                btn.disabled = false;
                btn.innerHTML = '<span class="text-lg">確認儲存</span>';
            }
        });

        function showStatus(text, type) {
            const msg = document.getElementById('statusMsg');
            msg.innerText = text;
            msg.className = `mt-6 p-4 rounded-2xl text-center shadow-lg font-bold bg-white ${type === 'success' ? 'text-green-600' : 'text-red-600'}`;
            msg.classList.remove('hidden');
            setTimeout(() => msg.classList.add('hidden'), 3500);
        }
    </script>
</body>
</html>
